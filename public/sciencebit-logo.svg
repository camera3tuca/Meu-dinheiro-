<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <style>
    .brand-science { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 64px; fill: #0A0A0A; }
    .brand-bit { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 64px; fill: #1366E2; }
    .brand-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.35em; fill: #0A0A0A; }
  </style>
  <g transform="translate(30, 65)">
    <text x="0" y="0" class="brand-science">Science<tspan class="brand-bit">Bit</tspan></text>
  </g>
  <g transform="translate(200, 100)">
    <!-- Left blue bar -->
    <rect x="-165" y="-6" width="38" height="4" rx="2" fill="#1366E2" />
    <!-- Center text -->
    <text x="0" y="0" text-anchor="middle" class="brand-sub">COMPUTER</text>
    <!-- Right blue bar -->
    <rect x="127" y="-6" width="38" height="4" rx="2" fill="#1366E2" />
  </g>
</svg>
